
name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - run: make install-dist
      - run: make run-dist